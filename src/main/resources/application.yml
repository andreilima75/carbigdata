spring:
  r2dbc:
    url: r2dbc:postgresql://db:5432/carbigdata
    username: postgres
    password: postgres
  rabbitmq:
    host: rabbitmq
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        acknowledge-mode: manual
        concurrency: 5
        max-concurrency: 10
        prefetch: 10
        missing-queues-fatal: false
    template:
      mandatory: true

  flyway:
    url: jdbc:postgresql://db:5432/carbigdata
    user: postgres
    password: postgres
    enabled: true

minio:
  url: http://minio:9000
  accessKey: minioadmin
  secretKey: minioadmin
  bucketName: ocorrencias

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus