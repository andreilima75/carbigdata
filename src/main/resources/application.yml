spring:
  r2dbc:
    url: ${SPRING_R2DBC_URL:r2dbc:postgresql://localhost:5432/carbigdata}
    username: postgres
    password: postgres
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        acknowledge-mode: manual
        concurrency: 5
        max-concurrency: 10
        prefetch: 10
        missing-queues-fatal: false
    template:
      mandatory: true

  flyway:
    url: ${SPRING_FLYWAY_URL:jdbc:postgresql://localhost:5432/carbigdata}
    user: postgres
    password: postgres
    enabled: true

minio:
  url: ${MINIO_URL:http://localhost:9000}
  accessKey: ${MINIO_ACCESS_KEY:minioadmin}
  secretKey: ${MINIO_SECRET_KEY:minioadmin}
  bucketName: ocorrencias

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus